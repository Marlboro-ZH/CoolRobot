<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音频播放</title>
    <style>
        body {
            text-align: center;
            margin-top: 50px;
            background: #f5f5f5;
        }
        .player {
            width: 90%;
            max-width: 400px;
            margin: 0 auto;
        }
        h2 {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="title">Cool Robot</div>
    <div class="tip">From：TeamTen</div>
    <div class="player">
        <!-- 在这里替换成你的音频文件名 -->
        <audio controls autoplay="false" src="CoolRobot.mp3" style="width:100%"></audio>
    </div>
</body>
</html>
